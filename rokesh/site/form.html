<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="wrap" style="max-width:520px;padding-top:40px"><h1 id="t" style="font-size:28px"></h1><p id="i" style="color:var(--mut)"></p>
<form id="f"></form><div class="msg" id="m"></div></div>
<script>
const id = new URLSearchParams(location.search).get('id') || '';
const $ = s => document.querySelector(s);
fetch('/api/public/forms/' + encodeURIComponent(id)).then(r => r.ok ? r.json() : Promise.reject()).then(f => {
  document.title = f.title; $('#t').textContent = f.title; $('#i').textContent = f.intro || '';
  f.fields.forEach(x => {
    const p = document.createElement('p'), l = document.createElement('label'); l.textContent = x.label + (x.required ? ' *' : '');
    const i = document.createElement(x.type === 'textarea' ? 'textarea' : 'input'); if (x.type !== 'textarea') i.type = x.type; i.name = x.name; i.required = x.required;
    p.append(l, i); $('#f').append(p);
  });
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Submit'; $('#f').append(b);
  $('#f').onsubmit = async e => {
    e.preventDefault(); const r = await fetch('/api/public/forms/' + encodeURIComponent(id) + '/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    const j = await r.json().catch(() => ({})); $('#m').textContent = r.ok ? 'Thanks, your response was recorded.' : (j.error || 'Something went wrong.'); if (r.ok) e.target.reset();
  };
}).catch(() => { $('#t').textContent = 'Form not found'; });
</script></body></html>
